name: pr-title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  lint:
    name: pr-title
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The title comes in through env, never interpolated into the script.
      # No checkout: this job never runs pull request code.
      - name: Check the title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_-]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title follows Conventional Commits."
          else
            echo "::error::PR title must follow Conventional Commits, for example 'feat(ops): add tiled matmul kernel'."
            exit 1
          fi
