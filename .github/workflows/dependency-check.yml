name: dependency-check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails when the pull request adds a direct dependency that no accepted
      # ADR lists. Runs with the runner's Node.
      - name: Check new dependencies against the ADRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/senior-standards/core/dependency-check.mjs --base "$BASE_SHA"
